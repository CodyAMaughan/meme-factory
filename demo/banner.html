<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=640" />
<title>Meme Factory banner</title>
<script src="assets/vendor/gsap.min.js"></script>
<link rel="stylesheet" href="assets/mf.css" />
<style>
  @font-face { font-family: 'Anton'; font-weight: 400; font-display: block; src: url('assets/fonts/Anton-400.woff2') format('woff2'); }
  @font-face { font-family: 'Archivo'; font-weight: 400; font-display: block; src: url('assets/fonts/Archivo-400.woff2') format('woff2'); }
  @font-face { font-family: 'Archivo'; font-weight: 800; font-display: block; src: url('assets/fonts/Archivo-800.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400; font-display: block; src: url('assets/fonts/JetBrainsMono-400.woff2') format('woff2'); }
  html, body { width: 1280px; height: 640px; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 72px; gap: 40px; }
  .left { flex: 1; display: flex; flex-direction: column; gap: 30px; }
  .left .sticker { box-shadow: 8px 8px 0 var(--pop); padding: 10px 24px 4px; border-width: 3px; }
  .left .caption-type { font-size: 96px; -webkit-text-stroke: 8px var(--ink); }
  .tagline { font: 800 52px/1.05 var(--ui); color: var(--paper); letter-spacing: -.01em; max-width: 600px; }
  .descriptor { font: 400 26px/1.3 var(--ui); color: #c9c1d3; max-width: 560px; }
  .right { position: relative; width: 470px; height: 520px; }
  .card { position: absolute; width: 300px; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 10px; box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }
  .card .img { height: 330px; border-radius: 8px; background: var(--ink); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card .img img { max-width: 100%; max-height: 100%; display: block; }
  .card .foot { font: 800 20px var(--ui); color: var(--ink); padding: 10px 4px 2px; display: flex; justify-content: space-between; }
  .card .foot span { font: 400 16px var(--mono); color: #625c6b; }
  .c1 { left: 0; top: 70px; transform: rotate(-9deg); }
  .c2 { left: 170px; top: 90px; transform: rotate(8deg); }
  .c3 { left: 80px; top: 30px; transform: rotate(-1deg); }
  .picked { position: absolute; left: 18px; top: -18px; background: var(--hi); border: 3px solid var(--ink); font: 700 18px var(--mono); padding: 4px 10px; color: var(--ink); transform: rotate(-4deg); }
</style>
</head>
<body>
<div id="root" data-composition-id="banner" data-start="0" data-duration="1" data-width="1280" data-height="640">
  <div class="wrap">
    <div class="left">
      <div class="sticker-tilt"><div class="sticker"><span class="caption-type">Meme Factory</span></div></div>
      <div class="tagline">Fresh from the factory.</div>
      <div class="descriptor"><div>A Claude Code mod.</div><div>Ask for a meme, keep working.</div></div>
    </div>
    <div class="right">
      <div class="card c1" data-layout-allow-occlusion><div class="img"><img src="assets/memes/fine.jpg" alt="" /></div><div class="foot" data-layout-allow-occlusion>This is Fine <span data-layout-allow-occlusion>7/10</span></div></div>
      <div class="card c2" data-layout-allow-occlusion><div class="img"><img src="assets/memes/db.jpg" alt="" /></div><div class="foot" data-layout-allow-occlusion>Distracted <span data-layout-allow-occlusion>8/10</span></div></div>
      <div class="card c3"><span class="picked">PICKED</span><div class="img"><img src="assets/memes/drake-meaner.jpg" alt="" /></div><div class="foot">Drake <span>9/10</span></div></div>
    </div>
  </div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  window.__timelines['banner'] = tl;
</script>
</body>
</html>
